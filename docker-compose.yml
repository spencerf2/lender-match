services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lender_match
      POSTGRES_PASSWORD: lender_match
      POSTGRES_DB: lender_match
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lender_match -d lender_match"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://lender_match:lender_match@postgres:5432/lender_match
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
