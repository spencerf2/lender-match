services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lender_match
      POSTGRES_PASSWORD: lender_match
      POSTGRES_DB: lender_match
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lender_match -d lender_match"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
